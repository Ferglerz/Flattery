[package]
name = "flattery"
version = "0.1.0"
edition = "2021"
authors = ["Fergler"]
license = "GPL-3.0-or-later"
description = "Frequency-domain leveling and spectral shaping plugin"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
debug-alloc = ["nih_plug/assert_process_allocs"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_vizia = { git = "https://github.com/robbert-vdh/nih-plug.git" }
pleasant-ui = { path = "../pleasant-ui" }
atomic_float = "1"
crossbeam-queue = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6"

[profile.release]
lto = "thin"
opt-level = 3
strip = "symbols"

[profile.dev]
opt-level = 1
